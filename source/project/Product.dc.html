<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<title>AS techno — Товар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="box-sizing: border-box; width: 100%; background: #FFFFFF; font-family: 'Manrope', 'Segoe UI', Arial, sans-serif; color: #1C2B22">
<dc-import name="Main" page="product" product="{{product}}" primary="{{primary}}" sun="{{sun}}" mascot="{{mascot}}" hint-size="100%,4400px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primary":{"editor":"color","default":"#26834C","options":["#26834C","#0B9446","#1F6E3F","#1C2B22"],"section":"Кольори"},"sun":{"editor":"color","default":"#F5C542","options":["#F5C542","#FFFFFF","#7FD4A0"],"section":"Кольори"},"mascot":{"editor":"enum","default":"always","options":["always","tips","off"],"section":"Інженер AS"},"product":{"editor":"enum","default":"gibrydna-ses-8-kvt","options":["merezheva-ses-5-kvt", "merezheva-ses-10-kvt", "merezheva-ses-15-kvt", "merezheva-ses-20-kvt", "merezheva-ses-30-kvt", "promyslova-ses-100-kvt-solis", "promyslova-ses-100-kvt-huawei", "gibrydna-ses-5-kvt", "gibrydna-ses-5-kvt-shvydkyi-zariad", "gibrydna-ses-8-kvt", "prosolax-x3-pro-15-kvt", "gibrydna-ses-20-kvt", "power-bank-fox", "avtonomna-systema-12-kvt", "dyness-b3", "pylontech-us3000c", "dyness-bx51100", "deye-ge-f60", "solax-aelio-50-100", "stromherz-s-50k", "panasonic-aquarea", "lg-therma-v", "samsung-ehs", "samsung-ehs-mono-ht", "mitsubishi-ecodan", "daikin-altherma-3-rw", "altek-pro-split", "hyundai-nc-clima-multi", "altek-pool-220v"],"section":"Товар"},"$preview":{"width":1440,"height":4400}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primary: this.props.primary ?? '#26834C',
      sun: this.props.sun ?? '#F5C542',
      mascot: this.props.mascot ?? 'always',
      product: this.props.product ?? 'gibrydna-ses-8-kvt'
    };
  }
}
</script>
</body>
</html>
